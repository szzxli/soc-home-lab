name: "Tool-call guard (log-only)"
description: "Score proposed agent tool calls from a JSONL log: allow / suspicious / block. Offline — it never runs a call and never touches the network."
author: "szzxli"

inputs:
  calls:
    description: "One or more JSONL files with tool calls (space-separated, globs allowed)."
    required: true
    default: "05-soc-skills/skills/agent-tool-call-guard/samples/eval-tool-calls.jsonl 05-soc-skills/skills/agent-tool-call-guard/samples/eval-extra-*.jsonl"
  fail-on-block:
    description: "Fail the step when any call is scored block."
    required: false
    default: "false"
  fail-on-suspicious:
    description: "Fail the step when any call is scored suspicious."
    required: false
    default: "false"

outputs:
  total:
    description: "Number of calls scored."
    value: ${{ steps.guard.outputs.total }}
  allow:
    description: "Number of calls scored allow."
    value: ${{ steps.guard.outputs.allow }}
  suspicious:
    description: "Number of calls scored suspicious."
    value: ${{ steps.guard.outputs.suspicious }}
  block:
    description: "Number of calls scored block."
    value: ${{ steps.guard.outputs.block }}
  accuracy:
    description: "Exact-match accuracy in percent (only when the log carries expected_verdict; empty otherwise)."
    value: ${{ steps.guard.outputs.accuracy }}
  blocked:
    description: "'true' when at least one call was scored block."
    value: ${{ steps.guard.outputs.blocked }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - id: guard
      shell: bash
      run: |
        python3 "${{ github.action_path }}/../../../05-soc-skills/skills/agent-tool-call-guard/guard.py" ${{ inputs.calls }} > guard-report.txt 2>&1
        code=$?
        cat guard-report.txt
        if [ "$code" -ne 0 ]; then
          echo "guard.py failed (exit $code)" >&2
          exit "$code"
        fi
        python3 - "$GITHUB_OUTPUT" guard-report.txt <<'PY'
        import re, sys
        out_path, report_path = sys.argv[1], sys.argv[2]
        text = open(report_path, encoding="utf-8").read()
        m = re.search(r"Total: (\d+) calls — allow (\d+), suspicious (\d+), block (\d+)", text)
        total, allow, susp, block = (int(x) for x in m.groups()) if m else (0, 0, 0, 0)
        acc = re.search(r"Exact-match accuracy: (\d+)/(\d+)", text)
        accuracy = str(round(100 * int(acc.group(1)) / int(acc.group(2)))) if acc else ""
        with open(out_path, "a", encoding="utf-8") as f:
            f.write(f"total={total}\nallow={allow}\nsuspicious={susp}\nblock={block}\n")
            f.write(f"accuracy={accuracy}\n")
            f.write(f"blocked={'true' if block > 0 else 'false'}\n")
            f.write(f"suspicious_found={'true' if susp > 0 else 'false'}\n")
        with open("guard-summary.md", "w", encoding="utf-8") as f:
            f.write("## Tool-call guard (log-only)\n\n")
            f.write(f"- Total calls: {total} — allow {allow}, suspicious {susp}, block {block}\n")
            if accuracy:
                f.write(f"- Exact-match accuracy: {accuracy}%\n")
            f.write("\n<details><summary>Per-call verdicts</summary>\n\n```\n")
            f.write(text)
            f.write("```\n\n</details>\n")
        PY
        cat guard-summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Fail on blocked calls
      if: inputs.fail-on-block == 'true' && steps.guard.outputs.blocked == 'true'
      shell: bash
      run: |
        echo "tool-call guard: ${{ steps.guard.outputs.block }} blocked call(s) found" >&2
        exit 1

    - name: Fail on suspicious calls
      if: inputs.fail-on-suspicious == 'true' && steps.guard.outputs.suspicious_found == 'true'
      shell: bash
      run: |
        echo "tool-call guard: ${{ steps.guard.outputs.suspicious }} suspicious call(s) found" >&2
        exit 1
