# Local detection lab only.
# Node-RED keeps the image default: adminAuth is not enabled.
# Both published ports are loopback. Do not change 127.0.0.1 to 0.0.0.0.
#
# The proxy uses the host network namespace so it can reach Node-RED on
# 127.0.0.1:1881 and write a combined access log. Talk to the lab at
# http://127.0.0.1:1880 so the deploy is recorded. Port 1881 is the
# container admin port and bypasses that log.
name: nodered-flow-audit

services:
  nodered:
    image: nodered/node-red:4.1.0
    container_name: nodered-flow-audit
    ports:
      - "127.0.0.1:1881:1880"

  proxy:
    image: nginx:1.27-alpine
    container_name: nodered-flow-audit-proxy
    network_mode: host
    depends_on: [nodered]
    volumes:
      - ./lab/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./lab/runtime:/var/log/nginx
